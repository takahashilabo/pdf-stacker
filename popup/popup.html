<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>PDF Stacker</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #666666;
    --accent: #3b5bdb;
    --accent-fg: #ffffff;
    --border: #e0e0e0;
    --danger: #c92a2a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1f22;
      --fg: #f1f1f1;
      --muted: #a0a0a0;
      --border: #3a3b3e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    width: 280px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif;
    background: var(--bg);
    color: var(--fg);
    padding: 16px;
  }
  h1 {
    font-size: 15px;
    margin: 0 0 4px;
  }
  .count {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 14px;
  }
  button {
    width: 100%;
    padding: 10px 12px;
    font-size: 13px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--fg);
    cursor: pointer;
    margin-bottom: 8px;
  }
  button.primary {
    background: var(--accent);
    color: var(--accent-fg);
    border-color: var(--accent);
    font-weight: 600;
  }
  button:disabled {
    opacity: 0.6;
    cursor: default;
  }
  .status {
    font-size: 12px;
    margin-top: 6px;
    min-height: 16px;
  }
  .status.success { color: #2b8a3e; }
  .status.error { color: var(--danger); }
  .scaleRow {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    color: var(--muted);
    margin: 4px 0 12px;
  }
  .scaleRow input {
    width: 56px;
    padding: 4px 6px;
    font-size: 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--fg);
    text-align: right;
  }
</style>
</head>
<body>
  <h1>PDF Stacker</h1>
  <div class="count" id="count">読み込み中...</div>
  <button id="captureBtn" class="primary">＋ このページを追加</button>
  <button id="manageBtn">スタックを管理...</button>
  <div class="scaleRow">
    <label for="scaleInput">キャプチャ時の縮小率</label>
    <span><input id="scaleInput" type="number" min="10" max="200" step="5" />%</span>
  </div>
  <div class="status" id="status"></div>

  <script src="../shared/db.js"></script>
  <script src="popup.js"></script>
</body>
</html>
